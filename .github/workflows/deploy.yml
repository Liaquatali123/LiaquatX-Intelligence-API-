name: Deploy LiaquatX Intelligence API
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liaquatx-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Provision or reuse Cloudflare D1
        run: node scripts/ensure-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply database schema
        run: npx wrangler d1 execute liaquatx-db --remote --file=./db/schema.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Type-check
        run: npm run typecheck
      - name: Configure Worker secrets
        shell: bash
        run: |
          printf '%s' "$ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET
          printf '%s' "$BINANCE_PAY_ID" | npx wrangler secret put BINANCE_PAY_ID
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BINANCE_PAY_ID: ${{ secrets.BINANCE_PAY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker and static dashboard
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
