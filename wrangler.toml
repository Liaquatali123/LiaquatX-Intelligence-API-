name = "liaquatx-intelligence-api"
main = "src/index.ts"
compatibility_date = "2026-11-21"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "liaquatx-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_NAME = "LiaquatX Intelligence API"
APP_ORIGIN = "*"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
